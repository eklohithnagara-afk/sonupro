/* ---------- STATE MGMT + MIGRATION ---------- */
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    let s;
    if (raw) s = JSON.parse(raw);
    else {
      // Try migrating from v0.1
      const old = localStorage.getItem('schoolFeeTracker_v0_1');
      if (old) {
        s = JSON.parse(old);
        toast("Migrated data from v0.1", "success");
      } else {
        s = JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }
    return migrateState(s);
  } catch (e) {
    console.error("Load failed", e);
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}

function migrateState(s) {
  // Convert old single-year format to multi-year
  if (!s.academicYears) {
    const oldYear = {
      id: "ay_" + Date.now().toString(36),
      label: s.settings?.academicYear || "2025-2026",
      startDate: s.settings?.academicYearStart || "2025-06-01",
      endDate: s.settings?.academicYearEnd || "2026-03-31",
      status: "active"
    };
    s.academicYears = [oldYear];
    s.currentYearId = oldYear.id;
    // Clean old keys
    if (s.settings) {
      delete s.settings.academicYear;
      delete s.settings.academicYearStart;
      delete s.settings.academicYearEnd;
    }
  }
  if (!s.routes) s.routes = [];
  if (!s.ecaActivities) s.ecaActivities = [];
  s.students.forEach(st => {
    if (st.vanRouteId === undefined) st.vanRouteId = "";
    if (st.vanFeeOverride === undefined) st.vanFeeOverride = null;
    if (!st.ecaIds) st.ecaIds = [];
  });
  if (!s.invoices) s.invoices = [];
  if (!s.payments) s.payments = [];
  if (!s.dayCareLogs) s.dayCareLogs = [];
  if (s.settings && s.settings.dayCareRate === undefined) s.settings.dayCareRate = 50;
  if (!s.receiptCounters) s.receiptCounters = {};
  if (!s.schemaVersion) s.schemaVersion = "0.1.1";
  return s;
}

function saveState(s = state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function resetState() { localStorage.removeItem(STORAGE_KEY); state = loadState(); render(); toast("Data reset to defaults", "info"); }
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `school-fee-tracker-v0.1.1-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast("Exported JSON", "success");
}
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      state = migrateState(data); saveState(); render();
      toast("Imported successfully", "success");
    } catch (err) { toast("Invalid JSON file", "error"); }
  };
  reader.readAsText(file);
}

/* ---------- AUDIT ---------- */
function audit(action, details) {
  state.auditLog.unshift({
    id: "a" + Date.now() + Math.random().toString(36).slice(2, 6),
    user: state.currentUser?.name || "system",
    action, details,
    timestamp: new Date().toISOString()
  });
  if (state.auditLog.length > 200) state.auditLog = state.auditLog.slice(0, 200);
  saveState();
}

/* ---------- TOAST ---------- */
function toast(msg, type = "info") {
  const colors = { success: "bg-emerald-600", error: "bg-rose-600", info: "bg-slate-700" };
  const div = document.createElement("div");
  div.className = `toast ${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg text-sm`;
  div.textContent = msg;
  document.getElementById("toast-container").appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

/* ---------- MODAL ---------- */

    <div class="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto hide-scrollbar slide-in">${html}</div>
  </div>`;
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

/* ---------- HELPERS ---------- */

const fmtDateTime = d => new Date(d).toLocaleString("en-IN", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
const className = id => state.classes.find(c => c.id === id)?.name || "—";
const siblingsOf = student => student.familyId ? state.students.filter(s => s.familyId === student.familyId) : [];

// Unique families: grouped by familyId
function getFamilies() {
  const map = new Map();
  state.students.forEach(s => {
    if (!s.familyId) return;
    if (!map.has(s.familyId)) {
      map.set(s.familyId, { id: s.familyId, parentName: s.parentName, parentPhone: s.parentPhone, members: [] });
    }
    map.get(s.familyId).members.push(s);
  });
  return Array.from(map.values());
}

function getCurrentYear() {
  return state.academicYears.find(y => y.id === state.currentYearId) || state.academicYears[0];
}

function isReadOnly() {
  return getCurrentYear()?.status === "archived";
}

  const d = new Date(y.startDate);
  for (let i = 0; i < 10; i++) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const label = d.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    months.push({ key, label });
    d.setMonth(d.getMonth()+1);
  }
  return months;
}
function monthLabel(key) {
  const [y,m] = key.split("-");
  return new Date(Number(y), Number(m)-1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
}

function invoicesForYear(yearId = state.currentYearId) {
  return state.invoices.filter(i => i.yearId === yearId);
}

function invoiceBalance(inv) { return inv.totalAmount - inv.paidAmount; }

function generateBillsForMonth(monthKey) {
  const yearId = state.currentYearId;
  const sd = state.settings.siblingDiscount;
  const activeStudents = state.students.filter(s => !s.archived);
  const yr = getCurrentYear();
  const monthIdx = getYearMonths(yr).findIndex(m => m.key === monthKey);

  // Determine sibling order per family (first-created child pays full price)
  const familyOrder = {};
  getFamilies().forEach(f => {
    const activeMembers = f.members.filter(m => !m.archived).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    activeMembers.forEach((m, idx) => familyOrder[m.id] = idx);
  });

  let created = 0;
  activeStudents.forEach(s => {
    const exists = state.invoices.some(i => i.studentId === s.id && i.yearId === yearId && i.month === monthKey);
    if (exists) return;

    const items = [{ head: "academic", label: "Academic Fee", amount: state.academicFees[s.classId] || 0 }];

    if (s.vanRouteId) {
      const route = state.routes.find(r => r.id === s.vanRouteId);
      if (route) {
        const applicable = route.billingFrequency === "monthly" || (route.billingFrequency === "half-yearly" && (monthIdx === 0 || monthIdx === 5));
        if (applicable) {
          const vanAmount = s.vanFeeOverride != null ? s.vanFeeOverride : route.amount;
          items.push({ head: "van", label: `Van - ${route.name}`, amount: vanAmount, routeId: route.id });
        }
      }
    }

    (s.ecaIds || []).forEach(ecaId => {
      const activity = state.ecaActivities.find(a => a.id === ecaId);
      if (!activity) return;
      if (activity.billingFrequency === "one-time") {
        const alreadyBilled = state.invoices.some(i => i.studentId === s.id && i.items.some(it => it.head === `eca_${ecaId}`));
        if (alreadyBilled) return;
      }
      items.push({ head: `eca_${ecaId}`, label: `ECA - ${activity.name}`, amount: activity.amount });
    });

    const pendingDayCareLogs = state.dayCareLogs.filter(l => l.studentId === s.id && !l.invoiced && l.date.slice(0,7) === monthKey);
    if (pendingDayCareLogs.length) {
      const totalHours = pendingDayCareLogs.reduce((sum,l) => sum + l.hours, 0);
      const totalAmount = pendingDayCareLogs.reduce((sum,l) => sum + l.amount, 0);
      items.push({ head: "daycare", label: `Day Care (${totalHours} hr)`, amount: totalAmount });
    }

    const isSiblingDiscountEligible = sd.enabled && s.familyId && (familyOrder[s.id] || 0) > 0;
    let discountAmount = 0;
    if (isSiblingDiscountEligible) {
      items.forEach(it => {
        const scoped = sd.appliesTo === "all" || (sd.appliesTo === "academic" && it.head === "academic");
        if (!scoped) return;
        const d = sd.type === "percent" ? Math.round(it.amount * sd.value / 100) : Math.min(sd.value, it.amount);
        discountAmount += d;
      });
    }

    const totalAmount = items.reduce((sum,it) => sum + it.amount, 0) - discountAmount;
    const invoice = {
      id: uid("inv"),
      studentId: s.id,
      yearId,
      month: monthKey,
      items,
      discountAmount,
      totalAmount,
      paidAmount: 0,
      status: "unpaid",
      createdAt: new Date().toISOString()
    };
    state.invoices.push(invoice);
    pendingDayCareLogs.forEach(l => { l.invoiced = true; l.invoiceId = invoice.id; });
    created++;
  });

  if (created > 0) {
    audit("billing", `Generated ${created} bill(s) for ${monthLabel(monthKey)}`);
    saveState();
  }
  return created;
}

function nextReceiptNumber() {
  const yr = getCurrentYear();
  const calYear = yr.label.split("-")[0];
  state.receiptCounters[calYear] = (state.receiptCounters[calYear] || 0) + 1;
  return `RCP-${calYear}-${String(state.receiptCounters[calYear]).padStart(4,"0")}`;
}

function recordPayment(invoiceId, amount, mode, date) {
  const inv = state.invoices.find(i => i.id === invoiceId);
  const balance = invoiceBalance(inv);
  if (amount <= 0 || amount > balance) { toast("Enter a valid amount (up to the balance due)", "error"); return null; }
  const payment = {
    id: uid("pay"),
    invoiceId,
    studentId: inv.studentId,
    amount,
    mode,
    date,
    receiptNo: nextReceiptNumber(),
    createdAt: new Date().toISOString()
  };
  state.payments.unshift(payment);
  inv.paidAmount += amount;
  inv.status = inv.paidAmount >= inv.totalAmount ? "paid" : (inv.paidAmount > 0 ? "partial" : "unpaid");
  const student = state.students.find(s => s.id === inv.studentId);
  audit("payment", `${fmtMoney(amount)} received from ${student.name} (${monthLabel(inv.month)}) via ${mode} — ${payment.receiptNo}`);
  saveState();
  return payment;
}

/* ---------- DAY CARE ---------- */
function computeDayCareHours(checkIn, checkOut) {
  const [ih, im] = checkIn.split(":").map(Number);
  const [oh, om] = checkOut.split(":").map(Number);
  const diffMin = (oh*60+om) - (ih*60+im);
  if (diffMin <= 0) return 0;
  return Math.max(1, Math.ceil(diffMin / 60));
}

function logDayCare(studentId, date, checkIn, checkOut) {
  const hours = computeDayCareHours(checkIn, checkOut);
  if (hours <= 0) { toast("Check-out must be after check-in", "error"); return null; }
  const rate = state.settings.dayCareRate;
  const log = { id: uid("dc"), studentId, date, checkIn, checkOut, hours, rate, amount: hours*rate, invoiced: false, invoiceId: null, createdAt: new Date().toISOString() };
  state.dayCareLogs.push(log);
  const s = state.students.find(x => x.id === studentId);
  audit("daycare", `${s.name} — Day Care logged ${checkIn}–${checkOut} (${hours} hr) on ${fmtDate(date)}`);
  saveState();
  return log;
}

function deleteDayCareLog(id) {
  const log = state.dayCareLogs.find(l => l.id === id);
  if (log.invoiced) { toast("Cannot delete — already billed", "error"); return; }
  if (!confirm("Delete this day care entry?")) return;
  state.dayCareLogs = state.dayCareLogs.filter(l => l.id !== id);
  audit("daycare", `Day care entry deleted for ${fmtDate(log.date)}`);
  saveState(); render();
  toast("Entry deleted", "info");
}

function statusBadge(status) {
  const map = {
    paid: "bg-emerald-100 text-emerald-700",
    partial: "bg-amber-100 text-amber-700",
    unpaid: "bg-rose-100 text-rose-700"
  };
  return `<span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${map[status]}">${status.toUpperCase()}</span>`;
}

/* ---------- WHATSAPP REMINDER ---------- */
function sendWhatsAppReminder(studentId) {
  const s = state.students.find(x => x.id === studentId);
  const pending = invoicesForYear().filter(i => i.studentId === studentId && i.status !== "paid").sort((a,b) => a.month.localeCompare(b.month));
  if (pending.length === 0) { toast("No pending dues for this student", "info"); return; }
  const balance = pending.reduce((sum,i) => sum + invoiceBalance(i), 0);
  const months = pending.map(i => monthLabel(i.month)).join(", ");
  const message = `Dear ${s.parentName}, this is a gentle reminder that fees of ${fmtMoney(balance)} for ${s.name} (${className(s.classId)}) are pending for ${months}. Kindly clear at your earliest convenience.\n\n- ${state.school.name}`;
  const digits = s.parentPhone.replace(/[^0-9]/g, "");
  const url = `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
  audit("reminder", `WhatsApp reminder sent to ${s.parentName} for ${s.name} (${fmtMoney(balance)} due)`);
}

   REPORTS HELPERS
   ========================================================= */
function headLabel(head) {
  if (head === "academic") return "Academic";
  if (head === "van") return "Van";
  if (head === "daycare") return "Day Care";
  if (head.startsWith("eca_")) {
    const a = state.ecaActivities.find(x => x.id === head.slice(4));
    return a ? `ECA - ${a.name}` : "ECA";
  }
  return head;
}

// Approximate collected-per-item by allocating each invoice's paidAmount
// proportionally across its line items (no per-item payment allocation exists yet).
function itemCollected(inv, item) {
  const grossSum = inv.items.reduce((s,it) => s+it.amount, 0);
  if (grossSum <= 0) return 0;
  return (item.amount / grossSum) * inv.paidAmount;
}

function printReport(title, bodyHtml) {
  const ts = new Date().toLocaleString("en-IN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  const html = `<html><head><title>${title} - ${fmtDate(new Date())}</title><style>
      body{font-family:-apple-system,Arial,sans-serif;padding:24px;color:#1e293b;}
      h1{font-size:18px;margin:0 0 2px;} .muted{color:#64748b;font-size:12px;margin:0 0 12px;}
      table{width:100%;border-collapse:collapse;margin-top:8px;}
      th,td{border-bottom:1px solid #e2e8f0;padding:6px 8px;text-align:left;font-size:12px;}
      th{background:#f8fafc;} .right{text-align:right;} .total-row td{font-weight:bold;border-top:2px solid #cbd5e1;}
      footer{margin-top:24px;font-size:10px;color:#94a3b8;text-align:center;}
    </style></head><body onload="window.print()">
      <h1>${state.school.name}</h1>
      <p class="muted">${title} · ${getCurrentYear().label}</p>
      ${bodyHtml}
      <footer>Generated ${ts}</footer>
    </body></html>`;
  const win = window.open("", "_blank");
  win.document.write(html); win.document.close();
}

          ${state.routes.map(r => `<option value="${r.id}" ${r.id===s.vanRouteId?'selected':''}>${r.name} (${fmtMoney(r.amount)} / ${r.billingFrequency==='monthly'?'mo':'half-yr'})</option>`).join("")}
        </select>
      </div>
      <div id="f-route-override-wrap" class="${s.vanRouteId ? '' : 'hidden'}">
        <label class="text-xs text-slate-500">Van Fee Override (optional)</label>
        <input id="f-route-override" type="number" value="${s.vanFeeOverride ?? ''}" placeholder="Leave blank to use route's default fee" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="text-xs text-slate-500">ECA Activities</label>
        <div class="mt-1 space-y-1 border border-slate-200 rounded-xl p-2">
          ${state.ecaActivities.length === 0 ? `<p class="text-xs text-slate-400 px-1">No activities set up yet</p>` : state.ecaActivities.map(a => `
            <label class="flex items-center gap-2 text-sm px-1 py-1">
              <input type="checkbox" class="f-eca" value="${a.id}" ${(s.ecaIds||[]).includes(a.id)?'checked':''} />
              <span>${a.name} <span class="text-xs text-slate-400">(${fmtMoney(a.amount)} · ${a.billingFrequency==='monthly'?'monthly':'one-time'})</span></span>
            </label>
          `).join("")}
        </div>
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      ${isEdit ? `<button onclick="deleteStudent('${s.id}')" class="px-4 py-2 bg-rose-100 text-rose-700 rounded-xl text-sm">Archive</button>` : ''}
      <button onclick="closeModal()" class="flex-1 px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancel</button>
      <button onclick="saveStudent('${editId||''}')" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium">Save</button>
    </div>
  `);
}

function saveStudent(editId) {
  const name = document.getElementById("f-name").value.trim();
  const classId = document.getElementById("f-class").value;
  const parentName = document.getElementById("f-parent").value.trim();
  const parentPhone = document.getElementById("f-phone").value.trim();
  let familyId = document.getElementById("f-family").value;
  const vanRouteId = document.getElementById("f-route").value;
  const overrideRaw = document.getElementById("f-route-override").value;
  const vanFeeOverride = vanRouteId && overrideRaw !== "" ? Number(overrideRaw) : null;
  const ecaIds = Array.from(document.querySelectorAll(".f-eca:checked")).map(el => el.value);
  if (!name || !parentName || !parentPhone) { toast("Please fill all required fields", "error"); return; }

  if (editId) {
    const s = state.students.find(x => x.id === editId);
    s.name = name; s.classId = classId; s.parentName = parentName; s.parentPhone = parentPhone;
    s.vanRouteId = vanRouteId; s.vanFeeOverride = vanFeeOverride; s.ecaIds = ecaIds;
    if (familyId === "__new__") s.familyId = uid("f");
    else s.familyId = familyId || "";
    audit("update", `Student ${name} updated`);
  } else {
    if (familyId === "__new__") familyId = uid("f");
    const newStudent = { id: uid("s"), name, classId, parentName, parentPhone, familyId: familyId || "", vanRouteId, vanFeeOverride, ecaIds, archived: false, createdAt: new Date().toISOString() };
    state.students.push(newStudent);
    audit("create", `Student ${name} added${familyId ? ' (linked to family)' : ''}`);
  }
  saveState(); closeModal(); render();
  toast("Saved", "success");
}

function deleteStudent(id) {
  const s = state.students.find(x => x.id === id);
  if (!confirm(`Archive ${s.name}? You can restore them later from the Archived tab.`)) return;
  s.archived = true;
  audit("archive", `Student ${s.name} archived`);
  saveState(); closeModal(); render();
  toast("Student archived", "info");
}

/* ---------- STUDENT DETAIL ---------- */
function renderStudentDetail() {
  const s = state.students.find(x => x.id === route.params.id);
  if (!s) return layout("Not Found", `<p>Student not found</p>`);
  const allSibs = siblingsOf(s).filter(x => x.id !== s.id);
  const activeSibs = allSibs.filter(x => !x.archived);
  const archivedSibs = allSibs.filter(x => x.archived);
  return layout(s.name, `
    <button onclick="navigate('students')" class="text-sm text-indigo-600 mb-3">← Back to students</button>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="flex items-center gap-2 mb-2">
        <p class="font-semibold text-lg">${s.name}</p>
        ${s.archived ? '<span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">Archived</span>' : ''}
      </div>
      <p class="text-sm text-slate-600">${className(s.classId)}</p>
      <hr class="my-3"/>
      <p class="text-xs text-slate-500">Parent</p>
      <p class="font-semibold">${s.parentName}</p>
      <p class="text-sm text-slate-600">${s.parentPhone}</p>
      <hr class="my-3"/>
      <p class="text-xs text-slate-500">Transport</p>
      ${s.vanRouteId ? (() => {
        const r = state.routes.find(x => x.id === s.vanRouteId);
        return r ? `<p class="text-sm">${r.name} · ${fmtMoney(s.vanFeeOverride ?? r.amount)}${s.vanFeeOverride!=null?' (override)':''} / ${r.billingFrequency==='monthly'?'month':'half-year'}</p>` : `<p class="text-sm text-slate-400">Route no longer exists</p>`;
      })() : `<p class="text-sm text-slate-400">— No van —</p>`}
      <hr class="my-3"/>
      <p class="text-xs text-slate-500">ECA Activities</p>
      ${(s.ecaIds||[]).length ? `<p class="text-sm">${s.ecaIds.map(id => state.ecaActivities.find(a=>a.id===id)?.name).filter(Boolean).join(", ")}</p>` : `<p class="text-sm text-slate-400">— None enrolled —</p>`}
      <hr class="my-3"/>
      <p class="text-xs text-slate-500">Family Members</p>
      ${activeSibs.length ? `<p class="text-sm">${activeSibs.map(x => x.name + " (" + className(x.classId) + ")").join(", ")}</p>` : ''}
      ${archivedSibs.length ? `<p class="text-xs text-slate-400 mt-1">Archived: ${archivedSibs.map(x => x.name).join(", ")}</p>` : ''}
      ${!activeSibs.length && !archivedSibs.length ? `<p class="text-sm text-slate-400">— No siblings linked —</p>` : ''}
      <hr class="my-3"/>
      <p class="text-xs text-slate-500">Joined</p>
      <p class="text-sm">${fmtDate(s.createdAt)}</p>
    </div>
    <div class="mt-3 flex gap-2">
      <button onclick="openStudentForm('${s.id}')" class="flex-1 py-2 bg-slate-100 rounded-xl text-sm font-medium">Edit</button>
      ${s.archived ? `<button onclick="restoreStudent('${s.id}')" class="flex-1 py-2 bg-emerald-100 text-emerald-700 rounded-xl text-sm font-medium">Restore</button>` : ''}
      ${activeSibs.length ? `<button onclick="navigate('studentDetail', {id:'${activeSibs[0].id}'})" class="flex-1 py-2 bg-amber-100 text-amber-700 rounded-xl text-sm font-medium">View Sibling</button>` : ''}
      ${!s.archived && !isReadOnly() ? `<button onclick="openDayCareForm(new Date().toISOString().slice(0,10)); setTimeout(()=>document.getElementById('dc-student').value='${s.id}',0)" class="flex-1 py-2 bg-sky-100 text-sky-700 rounded-xl text-sm font-medium">🧸 Log Day Care</button>` : ''}
    </div>
    ${renderStudentFeeSection(s)}
  `, "students");
}

function renderStudentFeeSection(s) {
  const invs = invoicesForYear().filter(i => i.studentId === s.id).sort((a,b) => a.month.localeCompare(b.month));
  const totalBilled = invs.reduce((sum,i) => sum + i.totalAmount, 0);
  const totalPaid = invs.reduce((sum,i) => sum + i.paidAmount, 0);
  const totalDue = totalBilled - totalPaid;
  return `
    <div class="mt-4 bg-white rounded-2xl shadow-sm p-5">
      <h3 class="font-semibold mb-3">Fees — ${getCurrentYear().label}</h3>
      <div class="grid grid-cols-3 gap-2 text-center mb-3">
        <div><p class="text-xs text-slate-500">Billed</p><p class="font-bold text-slate-800">${fmtMoney(totalBilled)}</p></div>
        <div><p class="text-xs text-slate-500">Paid</p><p class="font-bold text-emerald-600">${fmtMoney(totalPaid)}</p></div>
        <div><p class="text-xs text-slate-500">Due</p><p class="font-bold text-rose-600">${fmtMoney(totalDue)}</p></div>
      </div>
      ${totalDue > 0 ? `<button onclick="sendWhatsAppReminder('${s.id}')" class="w-full mb-3 py-2 bg-emerald-50 text-emerald-700 rounded-xl text-sm font-medium">📲 Send Reminder via WhatsApp</button>` : ''}
      ${invs.length === 0 ? `<p class="text-sm text-slate-400 text-center py-3">No bills generated yet for this student</p>` : `
        <div class="space-y-2">
          ${invs.map(i => `
            <div class="border border-slate-100 rounded-xl p-3 flex items-center justify-between">
              <div>
                <p class="text-sm font-medium text-slate-800">${monthLabel(i.month)}</p>
                <p class="text-xs text-slate-500">${fmtMoney(i.totalAmount)}${i.discountAmount ? ` <span class="text-amber-600">(sibling discount −${fmtMoney(i.discountAmount)})</span>` : ''} · Paid ${fmtMoney(i.paidAmount)}</p>
              </div>
              <div class="flex items-center gap-2">
                ${statusBadge(i.status)}
                ${i.status !== 'paid' && !isReadOnly() ? `<button onclick="openPaymentModal('${i.id}')" class="text-xs bg-indigo-600 text-white px-2 py-1 rounded-lg">Pay</button>` : ''}
              </div>
            </div>
          `).join("")}
        </div>
      `}
    </div>`;
}

/* ---------- BILLING ---------- */
function renderBilling() {
  const view = route.params.view || "month";
  const yr = getCurrentYear();
  const months = getYearMonths(yr);
  const selectedMonth = route.params.month || months[0].key;
  const yearInvoices = invoicesForYear();

  const monthInvoices = yearInvoices.filter(i => i.month === selectedMonth);
  const outstandingInvoices = yearInvoices.filter(i => i.status !== "paid").sort((a,b) => a.month.localeCompare(b.month));

  const monthBilled = monthInvoices.reduce((s,i)=>s+i.totalAmount,0);
  const monthCollected = monthInvoices.reduce((s,i)=>s+i.paidAmount,0);
  const monthOutstanding = monthBilled - monthCollected;

  return layout("Billing", `
    <div class="flex gap-2 mb-3">
      <button onclick="navigate('billing',{view:'month', month:'${selectedMonth}'})" class="flex-1 py-2 rounded-xl text-sm font-medium ${view==='month'?'bg-indigo-600 text-white':'bg-white text-slate-600'}">By Month</button>
      <button onclick="navigate('billing',{view:'outstanding'})" class="flex-1 py-2 rounded-xl text-sm font-medium ${view==='outstanding'?'bg-slate-700 text-white':'bg-white text-slate-600'}">Outstanding (${outstandingInvoices.length})</button>
    </div>

    ${isReadOnly() ? `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-3 text-xs text-amber-800">🔒 ${yr.label} is archived — read-only.</div>` : ''}

    ${view === 'month' ? `
      <div class="flex gap-2 mb-3">
        <select onchange="navigate('billing',{view:'month', month:this.value})" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm">
          ${months.map(m => `<option value="${m.key}" ${m.key===selectedMonth?'selected':''}>${m.label}</option>`).join("")}
        </select>
        ${!isReadOnly() ? `<button onclick="handleGenerateBills('${selectedMonth}')" class="bg-indigo-600 text-white px-4 rounded-xl text-sm font-medium whitespace-nowrap">Generate Bills</button>` : ''}
      </div>

      <div class="grid grid-cols-3 gap-2 mb-3 text-center">
        <div class="bg-white p-3 rounded-xl shadow-sm"><p class="text-xs text-slate-500">Billed</p><p class="font-bold text-slate-800">${fmtMoney(monthBilled)}</p></div>
        <div class="bg-white p-3 rounded-xl shadow-sm"><p class="text-xs text-slate-500">Collected</p><p class="font-bold text-emerald-600">${fmtMoney(monthCollected)}</p></div>
        <div class="bg-white p-3 rounded-xl shadow-sm"><p class="text-xs text-slate-500">Pending</p><p class="font-bold text-rose-600">${fmtMoney(monthOutstanding)}</p></div>
      </div>

      <div class="space-y-2">
        ${monthInvoices.length === 0 ? `<p class="text-sm text-slate-400 text-center py-6">No bills generated for ${monthLabel(selectedMonth)} yet. Tap "Generate Bills" above.</p>` :
          monthInvoices.map(i => invoiceRow(i)).join("")}
      </div>
    ` : `
      <div class="space-y-2">
        ${outstandingInvoices.length === 0 ? `<p class="text-sm text-slate-400 text-center py-6">No outstanding dues 🎉</p>` :
          outstandingInvoices.map(i => invoiceRow(i, true)).join("")}
      </div>
    `}
  `);
}

function invoiceRow(i, showMonth = false) {
  const s = state.students.find(x => x.id === i.studentId);
  if (!s) return "";
  return `
    <div class="bg-white rounded-2xl shadow-sm p-4 flex items-center justify-between">
      <div class="cursor-pointer flex-1" onclick="navigate('studentDetail',{id:'${s.id}'})">
        <p class="font-semibold text-slate-800">${s.name} <span class="text-xs text-slate-400 font-normal">${className(s.classId)}</span></p>
        ${showMonth ? `<p class="text-xs text-slate-500">${monthLabel(i.month)}</p>` : ''}
        <p class="text-xs text-slate-500">${fmtMoney(i.totalAmount)} · Paid ${fmtMoney(i.paidAmount)} · Due ${fmtMoney(invoiceBalance(i))}</p>
      </div>
      <div class="flex items-center gap-2">
        ${statusBadge(i.status)}
        ${i.status !== 'paid' ? `<button onclick="sendWhatsAppReminder('${s.id}')" class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg">📲</button>` : ''}
        ${i.status !== 'paid' && !isReadOnly() ? `<button onclick="openPaymentModal('${i.id}')" class="text-xs bg-indigo-600 text-white px-2 py-1 rounded-lg">Pay</button>` : ''}
      </div>
    </div>`;
}

function handleGenerateBills(monthKey) {
  const count = generateBillsForMonth(monthKey);
  render();
  toast(count > 0 ? `Generated ${count} bill(s) for ${monthLabel(monthKey)}` : "All students already billed for this month", count > 0 ? "success" : "info");
}

/* ---------- PAYMENT MODAL ---------- */
function openPaymentModal(invoiceId) {
  const inv = state.invoices.find(i => i.id === invoiceId);
  const s = state.students.find(x => x.id === inv.studentId);
  const balance = invoiceBalance(inv);
  openModal(`
    <h3 class="text-lg font-bold mb-1">Record Payment</h3>
    <p class="text-sm text-slate-500 mb-4">${s.name} · ${monthLabel(inv.month)}</p>
    <div class="bg-slate-50 rounded-xl p-3 mb-4 text-sm">
      <div class="flex justify-between"><span class="text-slate-500">Total</span><span>${fmtMoney(inv.totalAmount)}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Paid so far</span><span>${fmtMoney(inv.paidAmount)}</span></div>
      <div class="flex justify-between font-semibold"><span>Balance Due</span><span>${fmtMoney(balance)}</span></div>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-slate-500">Amount *</label>
        <input id="p-amount" type="number" value="${balance}" max="${balance}" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="text-xs text-slate-500">Mode *</label>
        <select id="p-mode" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm">
          <option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option><option>Card</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-500">Date *</label>
        <input id="p-date" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button onclick="closeModal()" class="flex-1 px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancel</button>
      <button onclick="submitPayment('${invoiceId}')" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium">Record Payment</button>
    </div>
  `);
}

function submitPayment(invoiceId) {
  const amount = Number(document.getElementById("p-amount").value);
  const mode = document.getElementById("p-mode").value;
  const date = document.getElementById("p-date").value;
  if (!amount || !date) { toast("Please fill all fields", "error"); return; }
  const payment = recordPayment(invoiceId, amount, mode, date);
  if (!payment) return;
  closeModal(); render();
  toast(`Payment recorded — ${payment.receiptNo}`, "success");
  openReceiptWindow(payment.id);
}

/* ---------- RECEIPT (printable) ---------- */
function openReceiptWindow(paymentId) {
  const p = state.payments.find(x => x.id === paymentId);
  const inv = state.invoices.find(i => i.id === p.invoiceId);
  const s = state.students.find(x => x.id === p.studentId);
  const balance = invoiceBalance(inv);
  const html = `
    <html><head><title>${p.receiptNo}</title>
    <style>
      body{font-family:-apple-system,Arial,sans-serif;padding:24px;color:#1e293b;}
      h1{font-size:18px;margin:0;} p{margin:4px 0;font-size:13px;}
      table{width:100%;border-collapse:collapse;margin-top:16px;}
      td,th{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left;font-size:13px;}
      .right{text-align:right;} .muted{color:#64748b;} .total{font-weight:bold;font-size:15px;}
      .sig{margin-top:60px;border-top:1px solid #94a3b8;width:200px;text-align:center;font-size:12px;padding-top:4px;}
    </style></head>
    <body onload="window.print()">
      <h1>${state.school.name}</h1>
      <p class="muted">${state.school.address} · ${state.school.phone}</p>
      <hr/>
      <p><b>Receipt No:</b> ${p.receiptNo} &nbsp; <b>Date:</b> ${fmtDate(p.date)}</p>
      <p><b>Student:</b> ${s.name} (${className(s.classId)}) &nbsp; <b>Parent:</b> ${s.parentName}</p>
      <p><b>Billing Month:</b> ${monthLabel(inv.month)}</p>
      <table>
        <tr><th>Description</th><th class="right">Amount</th></tr>
        ${inv.items.map(it => `<tr><td>${it.label}</td><td class="right">${fmtMoney(it.amount)}</td></tr>`).join("")}
        ${inv.discountAmount ? `<tr><td>Sibling Discount</td><td class="right">−${fmtMoney(inv.discountAmount)}</td></tr>` : ''}
        <tr><td>Total Fee</td><td class="right">${fmtMoney(inv.totalAmount)}</td></tr>
        <tr><td><b>Amount Paid (${p.mode})</b></td><td class="right"><b>${fmtMoney(p.amount)}</b></td></tr>
        <tr><td class="total">Balance Remaining</td><td class="right total">${fmtMoney(balance)}</td></tr>
      </table>
      <div class="sig">Authorized Signature</div>
    </body></html>`;
  const win = window.open("", "_blank");
  win.document.write(html);
  win.document.close();
}

/* ---------- DAY CARE PAGE ---------- */
function renderDayCarePage() {
  const date = route.params.date || new Date().toISOString().slice(0,10);
  const logs = state.dayCareLogs.filter(l => l.date === date).sort((a,b) => a.checkIn.localeCompare(b.checkIn));
  const monthKey = date.slice(0,7);
  const monthLogs = state.dayCareLogs.filter(l => l.date.slice(0,7) === monthKey);
  const monthPending = monthLogs.filter(l => !l.invoiced).reduce((s,l)=>s+l.amount,0);
  const monthBilled = monthLogs.filter(l => l.invoiced).reduce((s,l)=>s+l.amount,0);

  return layout("Day Care", `
    <div class="flex gap-2 mb-3">
      <input type="date" value="${date}" onchange="navigate('daycare',{date:this.value})" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm" />
      ${!isReadOnly() ? `<button onclick="openDayCareForm('${date}')" class="bg-indigo-600 text-white px-4 rounded-xl text-sm font-medium whitespace-nowrap">+ Log Entry</button>` : ''}
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3 text-center">
      <div class="bg-white p-3 rounded-xl shadow-sm"><p class="text-xs text-slate-500">This Month — Pending</p><p class="font-bold text-rose-600">${fmtMoney(monthPending)}</p></div>
      <div class="bg-white p-3 rounded-xl shadow-sm"><p class="text-xs text-slate-500">This Month — Billed</p><p class="font-bold text-emerald-600">${fmtMoney(monthBilled)}</p></div>
    </div>

    <div class="space-y-2">
      ${logs.length === 0 ? `<p class="text-sm text-slate-400 text-center py-6">No day care entries for ${fmtDate(date)}</p>` : logs.map(l => {
        const s = state.students.find(x => x.id === l.studentId);
        if (!s) return "";
        return `
        <div class="bg-white rounded-2xl shadow-sm p-4 flex items-center justify-between">
          <div class="cursor-pointer flex-1" onclick="navigate('studentDetail',{id:'${s.id}'})">
            <p class="font-semibold text-slate-800">${s.name} <span class="text-xs text-slate-400 font-normal">${className(s.classId)}</span></p>
            <p class="text-xs text-slate-500">${l.checkIn} – ${l.checkOut} · ${l.hours} hr · ${fmtMoney(l.amount)}</p>
          </div>
          ${l.invoiced ? `<span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium">BILLED</span>` : `<button onclick="deleteDayCareLog('${l.id}')" class="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded-lg">Delete</button>`}
        </div>`;
      }).join("")}
    </div>
  `);
}

function openDayCareForm(defaultDate) {

  openModal(`
    <h3 class="text-lg font-bold mb-4">Log Day Care</h3>
    <div class="space-y-3 text-sm">
      <div>
        <label class="text-xs text-slate-500">Student *</label>
        <select id="dc-student" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl">
          ${activeStudents.map(s => `<option value="${s.id}">${s.name} (${className(s.classId)})</option>`).join("")}
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-500">Date *</label>
        <input id="dc-date" type="date" value="${defaultDate}" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl" />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>

function submitDayCareLog() {
  const studentId = document.getElementById("dc-student").value;
  const date = document.getElementById("dc-date").value;
  const checkIn = document.getElementById("dc-in").value;
  const checkOut = document.getElementById("dc-out").value;
  if (!studentId || !date || !checkIn || !checkOut) { toast("Please fill all fields", "error"); return; }

  closeModal(); render();
  toast(`Logged ${log.hours} hr — ${fmtMoney(log.amount)}`, "success");

      <div class="flex flex-wrap gap-2 mt-2">

/* ---- 3. Defaulter List (per-student aggregate) ---- */
function defaulterAggregate() {
  const invs = invoicesForYear().filter(i => i.status !== "paid");
  const byStudent = {};
  invs.forEach(i => {
    if (!byStudent[i.studentId]) byStudent[i.studentId] = { studentId: i.studentId, balance: 0, months: [] };
    byStudent[i.studentId].balance += invoiceBalance(i);
    byStudent[i.studentId].months.push(monthLabel(i.month));
  });
  return Object.values(byStudent).sort((a,b) => b.balance - a.balance);
}

function vanRouteStats() {
  const invs = invoicesForYear();
  return state.routes.map(r => {

    invs.forEach(i => i.items.filter(it => it.head === "van" && (it.routeId === r.id || it.label === `Van - ${r.name}`)).forEach(it => {
      billed += it.amount; collected += itemCollected(i, it); count++;

    return { route: r, billed, collected, count };
  });

/* ---- 9. Monthly Consolidated Summary ---- */
function consolidatedRows() {
  const months = getYearMonths(getCurrentYear());
  const invs = invoicesForYear();
  return months.map(m => {
    const mInvs = invs.filter(i => i.month === m.key);
    const heads = { academic: 0, van: 0, eca: 0, daycare: 0 };
    mInvs.forEach(i => i.items.forEach(it => {
      if (it.head === "academic") heads.academic += it.amount;
      else if (it.head === "van") heads.van += it.amount;
      else if (it.head === "daycare") heads.daycare += it.amount;
      else if (it.head.startsWith("eca_")) heads.eca += it.amount;
    }));
    const billed = mInvs.reduce((s,i)=>s+i.totalAmount,0);
    const collected = mInvs.reduce((s,i)=>s+i.paidAmount,0);
    return { month: m.key, heads, billed, collected, outstanding: billed - collected, hasBills: mInvs.length > 0 };
  });
}

function saveRoute(editId) {
  const name = document.getElementById("r-name").value.trim();
  const amount = Number(document.getElementById("r-amount").value);
  const billingFrequency = document.getElementById("r-freq").value;
  if (!name || !amount) { toast("Please fill all fields", "error"); return; }
  if (editId) {
    const r = state.routes.find(x => x.id === editId);
    r.name = name; r.amount = amount; r.billingFrequency = billingFrequency;
    audit("settings", `Route ${name} updated`);
  } else {
    state.routes.push({ id: uid("r"), name, amount, billingFrequency });
    audit("settings", `Route ${name} added`);
  }
  saveState(); closeModal(); render();
  toast("Route saved", "success");
}

function deleteRoute(id) {
  const inUse = state.students.some(s => !s.archived && s.vanRouteId === id);
  if (inUse) { toast("Cannot delete — students are assigned to this route", "error"); return; }
  const r = state.routes.find(x => x.id === id);
  if (!confirm(`Delete route ${r.name}?`)) return;
  state.routes = state.routes.filter(x => x.id !== id);
  audit("settings", `Route ${r.name} deleted`);
  saveState(); render();
  toast("Route deleted", "info");
}

   ========================================================= */
function layout(title, content, back = null) {
  const yr = getCurrentYear();
  const navItems = [
    { name: "dashboard", label: "Home", icon: "🏠" },
    { name: "students",  label: "Students", icon: "👨‍🎓" },
    { name: "billing",   label: "Billing", icon: "💳" },
    { name: "settings",  label: "Settings", icon: "⚙️" }
  ];
  return `
    <div class="min-h-screen pb-20">
      <div class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 py-3">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="font-bold text-slate-800">${title}</h1>
            <p class="text-xs text-slate-400">${state.school.name}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full">${state.currentUser?.role || ""}</span>
            <button onclick="if(confirm('Logout?')){state.currentUser=null;saveState();navigate('login')}" class="text-xs text-rose-600">Logout</button>
          </div>
        </div>
        <div class="mt-2 flex items-center gap-2">
          <span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">📅 ${yr.label}</span>
          ${yr.status === 'archived' ? '<span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">🔒 READ-ONLY</span>' : ''}
          <button onclick="openYearSwitcher()" class="text-[10px] text-indigo-600 underline ml-auto">Switch year</button>
        </div>
      </div>
      <div class="p-4 slide-in">${content}</div>
      <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30">
        <div class="max-w-lg mx-auto grid grid-cols-4">
          ${navItems.map(n => `
            <button onclick="navigate('${n.name}')" class="py-2 text-center ${route.name===n.name?'text-indigo-600':'text-slate-500'}">
              <div class="text-xl">${n.icon}</div>
              <div class="text-[10px]">${n.label}</div>
            </button>
          `).join("")}
        </div>
      </div>
    </div>`;
}

function openYearSwitcher() {
  const yr = getCurrentYear();
  openModal(`
    <h3 class="text-lg font-bold mb-3">Switch Academic Year</h3>
    <p class="text-xs text-slate-500 mb-3">Currently viewing: <b>${yr.label}</b></p>
    <div class="space-y-2">
      ${state.academicYears.map(y => `
        <button onclick="switchYear('${y.id}');closeModal()" class="w-full text-left p-3 rounded-xl border ${y.id === state.currentYearId ? 'border-indigo-500 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
          <div class="flex items-center justify-between">
            <div>
              <p class="font-semibold text-slate-800">${y.label}</p>
              <p class="text-xs text-slate-500">${fmtDate(y.startDate)} – ${fmtDate(y.endDate)}</p>
            </div>
            ${y.id === state.currentYearId ? '<span class="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-full">NOW</span>' : (y.status === 'archived' ? '<span class="text-[10px] bg-slate-300 text-slate-700 px-2 py-0.5 rounded-full">🔒</span>' : '<span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">Active</span>')}
          </div>
        </button>
      `).join("")}
    </div>
    <button onclick="openAddYearForm()" class="w-full mt-3 py-2 border-2 border-dashed border-slate-300 rounded-xl text-slate-600 text-sm">+ Add New Year</button>
    <button onclick="closeModal()" class="w-full mt-2 py-2 bg-slate-100 rounded-xl text-sm">Close</button>
  `);
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const view = VIEWS[route.name] || renderDashboard;
  document.getElementById("app").innerHTML = view();
}

/* ---------- BOOT ---------- */
if (state.currentUser) navigate("dashboard");
else navigate("login");
</script>
</body>
</html>
